[package]
name = "lowlat-audio"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lowlat-common.workspace = true
# The wire's own constants, so the sample rate is one value rather than two
# that agree today.
lowlat-core.workspace = true
# The codec, as a pure-Rust port rather than as bindings: no runtime library to
# find, and a decoder measured matching the reference decoder to one step of a
# sample on every stream tried, hybrid packets included. Its `unsafe` is SIMD
# kernels picked at run time, each with a scalar twin it is tested against.
# BSD-3-Clause, no dependencies, no build script.
rusty-opus.workspace = true

# The system's sound service: its object creation and apartment, a property's
# value, and the events the capture waits on, as the system declares them.
# The sound interfaces themselves are generated from the SDK's headers
# (scripts/gen-wasapi-bindings.sh), since these declarations carry none.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[dev-dependencies]
lowlat-common = { workspace = true, features = ["alloc-counter"] }

[lints]
workspace = true
